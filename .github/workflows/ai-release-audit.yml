name: ai-release-audit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to audit"
        required: true
        type: string
      dry_run:
        description: "Report findings without creating an Issue"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: ai-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit published release
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MAINTAINER_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python .github/ai-flows/release_audit.py
          --release-tag "${{ inputs.release_tag }}"
