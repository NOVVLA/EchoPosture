name: quality-gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: python-quality
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff static checks
        run: ruff check .github/ai-flows/branch_preflight.py .github/ai-flows/release_notes.py debug_ui.py gpu_blur_overlay.py onboarding_toast.py overlay_test.py posture_console.py test_ai_maintainer_manual_flows.py test_startup_guards.py test_tray_flyout.py test_vision_worker.py tray_app.py tray_flyout.py vision_test.py vision_worker.py

      - name: Compile Python source
        shell: pwsh
        run: |
          $files = @(
            "debug_ui.py",
            ".github/ai-flows/branch_preflight.py",
            ".github/ai-flows/release_notes.py",
            "gpu_blur_overlay.py",
            "onboarding_toast.py",
            "overlay_test.py",
            "posture_console.py",
            "test_ai_maintainer_manual_flows.py",
            "test_startup_guards.py",
            "test_tray_flyout.py",
            "test_vision_worker.py",
            "tray_app.py",
            "tray_flyout.py",
            "vision_test.py",
            "vision_worker.py"
          )
          python -m py_compile @files

      - name: Run logic tests
        run: |
          python test_startup_guards.py
          python test_tray_flyout.py
          python test_vision_worker.py
          python test_ai_maintainer_manual_flows.py

  windows-build:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build launcher and native host
        shell: cmd
        run: build_launcher.cmd
