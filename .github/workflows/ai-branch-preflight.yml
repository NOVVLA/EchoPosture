name: ai-branch-preflight

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Trusted comparison branch"
        required: true
        default: "main"
        type: string
      target_ref:
        description: "Ref to inspect (normally HEAD or a branch name)"
        required: true
        default: "HEAD"
        type: string
      dry_run:
        description: "Record this read-only advisory execution"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  framework:
    name: ai-branch-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run framework
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MAINTAINER_DRY_RUN: ${{ inputs.dry_run }}
        run: >-
          python .github/ai-flows/branch_preflight.py
          --base-ref "${{ inputs.base_ref }}"
          --target-ref "${{ inputs.target_ref }}"
